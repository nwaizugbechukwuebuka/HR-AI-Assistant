services:
  postgres:
    image: postgres:16
    container_name: hr-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hr_ai_assistant
      POSTGRES_USER: hr_ai_user
      POSTGRES_PASSWORD: hr_ai_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hr_ai_user -d hr_ai_assistant",
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: